name: Build APK from Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Website to APK Action
        uses: darkshredder/web-to-app-action@latest
        with:
          build-folder-path: "."      # مسیر فایل‌های HTML تو (اگر تو ریشه هستن)
          app-name: "MyApp"           # اسم اپت
          output-folder-path: "apk"   # مسیر خروجی APK

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Final-APK
          path: apk/
